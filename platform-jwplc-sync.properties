# Repositorio destino del package Arduino JWPLC
PLATFORM_REPO=JW-Control/platform-jwplc

# Rama base hacia donde irá el PR: la línea de platform-jwplc que se publica a continuación
# (ver RAMAS_Y_TAGS.md en jwplc-dev-mcp). Cambiarla al abrir o cerrar una línea.
PLATFORM_BASE_BRANCH=v2.1.0-alpha.15/OpenPLC-HMI/main

# Rama generada/actualizada por el workflow
PLATFORM_SYNC_BRANCH=sync/jw-libraries-v2.1

# Carpeta destino dentro de platform-jwplc
PLATFORM_LIBRARIES_PATH=JWPLC/2.1.0/libraries

# Librerías que se copiarán desde JW-Libraries/libraries/
# JW_DWIN va con JW_RS485 y JW_ModbusRTU, de las que depende.
# JW_MatrixButtons, JW_FRAM, JW_RTC y JW_SD quedan fuera: sus copias en el package 2.1.0
# difieren de las de este repositorio y la sincronización las reemplazaría.
LIBRARIES="JW_RS485 JW_ModbusRTU JW_DWIN"
