# Repositorio destino del package Arduino JWPLC
PLATFORM_REPO=JW-Control/platform-jwplc

# Rama base hacia donde irá el PR: la «…/main» de la línea de platform-jwplc que se
# publica a continuación (ver RAMAS_Y_TAGS.md en jwplc-dev-mcp). Cambiarla al abrir
# o cerrar una línea.
PLATFORM_BASE_BRANCH=v2.1.0-alpha.17/JWPLC-Sim/main

# Rama generada/actualizada por el workflow (formato de ramas de platform-jwplc:
# una feature de la línea, que se borra al fusionar).
PLATFORM_SYNC_BRANCH=v2.1.0-alpha.17/JWPLC-Sim/feature/sync-jw-libraries

# Carpeta destino dentro de platform-jwplc
PLATFORM_LIBRARIES_PATH=JWPLC/2.1.0/libraries

# Librerías que se copian desde JW-Libraries/libraries/ (alpha.17: todas las JW_* del
# package). JW_DWIN va con JW_RS485 y JW_ModbusRTU, de las que depende.
# Las precompiladas del package (JW_FRAM, JW_MatrixButtons, JW_SD) conservan su
# src/esp32/*.a; si su código cambia, quedan en modo fuente hasta el cierre de la alpha
# (ver tools/sync-platform-jwplc.sh).
LIBRARIES="JW_RS485 JW_ModbusRTU JW_DWIN JW_RTC JW_FRAM JW_SD JW_MatrixButtons"

# Rutas que no van al package: ejemplos para otro hardware (GLCD ST7920, botones en
# GPIO34/35/39), que no aplican al JWPLC Basic.
SYNC_EXCLUDE="JW_MatrixButtons/examples/04_GLCD_MenuDemo JW_MatrixButtons/examples/05_DirectButtons_IO35_IO34_IO39"
